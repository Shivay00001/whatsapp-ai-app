<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp AI Agent — Live Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #0b141a;
         color: #e9edef; display: flex; height: 100vh; }
  #chat-wrap { flex: 1; display: flex; flex-direction: column; max-width: 720px;
               margin: 0 auto; width: 100%; }
  header { background: #202c33; padding: 12px 16px; display: flex; gap: 12px;
           align-items: center; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: #00a884;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; }
  header b { font-size: 16px; } header small { color: #8696a0; font-size: 12px; }
  #sender-row { background: #182229; padding: 8px 16px; font-size: 12px; color: #8696a0;
                display: flex; gap: 8px; align-items: center; }
  #sender-row input { background: #2a3942; border: none; color: #e9edef; border-radius: 6px;
                      padding: 4px 8px; font-size: 12px; width: 160px; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px;
          background: #0b141a; }
  .msg { max-width: 75%; padding: 8px 12px; border-radius: 10px; font-size: 14.5px;
         line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .bot { background: #202c33; align-self: flex-start; border-top-left-radius: 2px; }
  .user { background: #005c4b; align-self: flex-end; border-top-right-radius: 2px; }
  #input-row { display: flex; gap: 8px; padding: 10px 14px; background: #202c33; }
  #input-row input { flex: 1; background: #2a3942; border: none; border-radius: 20px;
                     padding: 10px 16px; color: #e9edef; font-size: 15px; outline: none; }
  #input-row button { background: #00a884; border: none; border-radius: 50%; width: 44px;
                      height: 44px; font-size: 18px; cursor: pointer; color: #fff; }
  #panel { width: 300px; background: #111b21; border-left: 1px solid #222d34;
           padding: 16px; overflow-y: auto; font-size: 13px; }
  #panel h3 { font-size: 13px; color: #8696a0; text-transform: uppercase;
              letter-spacing: 1px; margin: 14px 0 8px; }
  #panel h3:first-child { margin-top: 0; }
  .field { background: #202c33; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
  .field b { color: #8696a0; font-weight: 600; font-size: 11px; text-transform: uppercase;
             display: block; margin-bottom: 2px; }
  .field span { font-size: 14px; }
  .empty { color: #55616a; font-style: italic; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px;
          background: #2a3942; }
  .pill.on { background: #005c4b; } .pill.off { background: #3b4a54; }
  @media (max-width: 760px) { #panel { display: none; } }
</style>
</head>
<body>
<div id="chat-wrap">
  <header>
    <div class="avatar">🤖</div>
    <div><b>Arjun — VisionQuantech AI Agent</b><br><small id="mode">connecting…</small></div>
  </header>
  <div id="sender-row">Sender ID: <input id="sender" value="demo-user" spellcheck="false"></div>
  <div id="msgs"></div>
  <div id="input-row">
    <input id="text" placeholder="Type a message… (try Hinglish!)" autocomplete="off">
    <button onclick="send()" title="Send">➤</button>
  </div>
</div>
<div id="panel">
  <h3>Live lead extraction</h3>
  <div class="field"><b>Name</b><span id="f-name" class="empty">—</span></div>
  <div class="field"><b>Need</b><span id="f-need" class="empty">—</span></div>
  <div class="field"><b>Budget</b><span id="f-budget" class="empty">—</span></div>
  <div class="field"><b>Timeline</b><span id="f-timeline" class="empty">—</span></div>
  <h3>Booking</h3>
  <div class="field"><b>Date</b><span id="f-date" class="empty">—</span></div>
  <div class="field"><b>Time</b><span id="f-time" class="empty">—</span></div>
  <div class="field"><b>Status</b><span id="f-status" class="pill off">not booked</span></div>
  <h3>Session</h3>
  <div class="field"><b>Language</b><span id="f-lang">—</span></div>
  <div class="field"><b>Stage</b><span id="f-stage">—</span></div>
</div>
<script>
const msgs = document.getElementById('msgs');
function addMsg(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
}
function setField(id, v) {
  const el = document.getElementById(id);
  if (v) { el.textContent = v; el.classList.remove('empty'); }
  else { el.textContent = '—'; el.classList.add('empty'); }
}
async function send() {
  const input = document.getElementById('text');
  const text = input.value.trim(); if (!text) return;
  input.value = '';
  addMsg('user', text);
  const sender = document.getElementById('sender').value.trim() || 'demo-user';
  try {
    const r = await fetch('/api/chat', { method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({sender, text}) });
    const d = await r.json();
    addMsg('bot', d.reply);
    setField('f-name', d.lead.name); setField('f-need', d.lead.need);
    setField('f-budget', d.lead.budget); setField('f-timeline', d.lead.timeline);
    setField('f-date', d.booking.date); setField('f-time', d.booking.time);
    const st = document.getElementById('f-status');
    if (d.booking.confirmed) { st.textContent = '✅ confirmed'; st.className = 'pill on'; }
    else { st.textContent = 'not booked'; st.className = 'pill off'; }
    setField('f-lang', d.language); setField('f-stage', d.stage);
    document.getElementById('mode').textContent =
      d.llm ? 'online • AI replies' : 'online • rule-based mode';
  } catch (e) { addMsg('bot', '⚠️ Server se connect nahi ho paya.'); }
}
document.getElementById('text').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
fetch('/api/status').then(r => r.json()).then(s => {
  document.getElementById('mode').textContent = 'online • ' + s.llm;
}).catch(() => {});
addMsg('bot', '👋 Demo ready! Kuch likho — jaise "Namaste", "I need a website", ya "मुझे chatbot चाहिए".');
</script>
</body>
</html>
